global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  - job_name: "ares-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["ares-api:8000"]
        labels:
          service: "ares-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
