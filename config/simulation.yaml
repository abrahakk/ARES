webots:
  basic_time_step_ms: 16
  max_steps_per_episode: 2000
  coverage_success_threshold: 0.9

curriculum:
  
  - name: simple
    world_file: simulation/webots/worlds/simple.wbt
    purpose: infrastructure_check
  - name: static
    world_file: simulation/webots/worlds/maze.wbt
    purpose: primary_training
  - name: dynamic
    world_file: simulation/webots/worlds/dynamic.wbt
    purpose: robustness_and_failure_experiments
  - name: disaster_zone
    world_file: simulation/webots/worlds/disaster_zone.wbt
    purpose: held_out_generalization_only
    used_in_training: false   

communication_protocol_defaults:
  max_bandwidth_bytes_per_step: 2048
  packet_loss_probability: 0.0
  max_range_meters: 15.0
  latency_steps: 0

domain_randomization:
  obstacle_position_jitter_m: 0.15
  lidar_noise_std_m: 0.02
  gps_noise_std_m: 0.01
  imu_noise_std_rad: 0.01
  wheel_speed_noise_fraction: 0.03

scenarios:
  robot_failure:
    failure_step: 500
  surveillance:
    revisit_interval_steps: 300
    staleness_bonus_scale: 0.5
  search_rescue:
    detection_radius_m: 0.5
    information_bonus: 5.0
